<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Responsive Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7C600" />
    <meta name="description" content="Roti Wala - Fresh homemade food delivered to your doorstep with love, quality and hygiene." />
    
    <!-- Mobile Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Roti Wala" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Bootstrap CSS for responsive grid (optional) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    
    <!-- Premium Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

    <title>Roti Wala - Fresh Homemade Food Delivery</title>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%, #fffef8 0%, #fff7e6 45%, #faebd3 100%);font-family:'Outfit','Plus Jakarta Sans',sans-serif;z-index:999999;gap:18px;">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;">
          <img src="/logo.png" alt="Roti Waale Nashik" style="height:64px;width:auto;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(113,21,42,0.15));" />
        </div>
        <div style="width:160px;height:5px;background:rgba(113,21,42,0.1);border-radius:99px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;bottom:0;width:40%;background:linear-gradient(90deg,#991b1b,#d97706,#f59e0b);border-radius:99px;animation:initialSplashSlide 1.2s infinite ease-in-out;"></div>
        </div>
        <span style="color:#785340;font-size:0.75rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;">Loading Freshness...</span>
      </div>
      <style>
        @keyframes initialSplashSlide {
          0% { left: -40%; width: 30%; }
          50% { left: 35%; width: 50%; }
          100% { left: 100%; width: 30%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>


</html>
